[tool.poetry]
name = "deepplate"
version = "0.1.0"
description = "A project for deep learning plate recognition."
authors = ["Tristan <tristan@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0.0"
numpy = "^1.24.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^23.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"